name: Validate project

on:
  push:
    branches: [main, feat/manual-powerbi-d1]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build, tests and security (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_GENERATE_ASPNET_CERTIFICATE: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "10.0.x"
      - name: Install locked dependencies
        run: npm ci
      - name: Restore locked preparer dependencies
        shell: pwsh
        run: |
          dotnet restore tools/preparador/ComercialInsight.Preparador.csproj --locked-mode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CI_DOTNET=$((Get-Command dotnet).Source)" >> $env:GITHUB_ENV
      - name: Build and typecheck
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Automated tests including Windows preparer
        run: npm test
      - name: Local desktop and mobile UI smoke
        run: npm run test:ui
      - name: Native UI contract smoke
        run: node --import tsx tests/native-ui-smoke.ts
      - name: Audit npm dependencies
        run: npm audit
      - name: Audit NuGet dependencies
        shell: pwsh
        run: |
          $result = dotnet list tools/preparador/ComercialInsight.Preparador.csproj package --vulnerable --include-transitive --format json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $audit = $result | ConvertFrom-Json
          foreach ($project in $audit.projects) {
            foreach ($framework in $project.frameworks) {
              foreach ($package in @($framework.topLevelPackages) + @($framework.transitivePackages)) {
                if ($package.vulnerabilities.Count -gt 0) { throw "Vulnerable NuGet package: $($package.id)" }
              }
            }
          }
      - name: Scan Git history for secrets
        shell: pwsh
        run: ./scripts/check-secrets.ps1
