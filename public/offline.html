<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#091c36">
  <title>Sem conexão · Comercial Insight</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: linear-gradient(165deg, #091b33, #0e2443 70%, #102746);
      color: #f4f6fa;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      text-align: center;
    }
    main {
      width: min(400px, 100%);
      padding: 28px 24px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.16);
    }
    img { width: 64px; height: 64px; border-radius: 14px; margin-bottom: 14px; }
    h1 { margin: 0 0 8px; font-size: 20px; font-weight: 700; }
    p { margin: 0 0 20px; font-size: 14px; line-height: 1.5; color: #c7d5ea; }
    a {
      display: inline-block;
      padding: 11px 18px;
      border-radius: 10px;
      background: #5942d6;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main>
    <img src="/icon-192.png" alt="Comercial Insight">
    <h1>Você está sem internet</h1>
    <p>As consultas em tempo real precisam de conexão com a API. Assim que o sinal voltar, tente abrir novamente.</p>
    <a href="/">Tentar reconectar</a>
  </main>
</body>
</html>
